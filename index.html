<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<style>
  /* ========== RESET & BASE ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    touch-action: none;
  }

  /* ========== GAME WRAPPER ========== */
  #gameWrapper {
    position: relative;
    width: 420px;
    height: 640px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 0 0 3px rgba(255,255,255,0.08),
      0 0 60px rgba(100,180,255,0.25),
      0 30px 80px rgba(0,0,0,0.7);
  }

  /* ========== MAIN CANVAS ========== */
  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }

  /* ========== OVERLAY SCREENS ========== */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5, 12, 30, 0.82);
    backdrop-filter: blur(6px);
    z-index: 10;
    transition: opacity 0.4s ease;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  /* ========== START SCREEN ========== */
  #startScreen .bird-icon {
    font-size: 72px;
    animation: float 2s ease-in-out infinite;
    filter: drop-shadow(0 0 18px rgba(255,210,60,0.7));
  }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(-5deg); }
    50%      { transform: translateY(-14px) rotate(5deg); }
  }
  #startScreen h1 {
    font-size: 44px;
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #FFD93D, #FF6B6B, #6BCBFF);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 16px 0 6px;
    text-shadow: none;
  }
  #startScreen p {
    color: rgba(255,255,255,0.55);
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 36px;
  }
  .btn {
    padding: 14px 48px;
    font-size: 18px;
    font-weight: 700;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.15s, box-shadow 0.15s;
    background: linear-gradient(135deg, #FFD93D, #FF6B35);
    color: #1a0a00;
    box-shadow: 0 6px 24px rgba(255,180,50,0.45);
  }
  .btn:hover  { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,180,50,0.55); }
  .btn:active { transform: translateY(1px);  box-shadow: 0 3px 12px rgba(255,180,50,0.3); }

  .hint {
    margin-top: 20px;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.5px;
  }

  /* ========== GAMEOVER SCREEN ========== */
  #gameoverScreen h2 {
    font-size: 40px;
    font-weight: 900;
    color: #FF6B6B;
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(255,80,80,0.6);
    margin-bottom: 28px;
  }
  .score-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 24px 48px;
    text-align: center;
    margin-bottom: 28px;
  }
  .score-card .label {
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .score-card .val {
    font-size: 52px;
    font-weight: 900;
    color: #FFD93D;
    line-height: 1;
    text-shadow: 0 0 20px rgba(255,217,61,0.5);
  }
  .score-card .best-row {
    margin-top: 14px;
    font-size: 13px;
    color: rgba(255,255,255,0.45);
  }
  .score-card .best-row span {
    color: #6BCBFF;
    font-weight: 700;
  }
  #gameoverScreen .btn { margin-top: 4px; }

  /* ========== HUD SCORE ========== */
  #hudScore {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 42px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 3px 12px rgba(0,0,0,0.5), 0 0 30px rgba(100,200,255,0.3);
    z-index: 5;
    pointer-events: none;
    letter-spacing: 2px;
    transition: transform 0.1s;
  }
  #hudScore.pop { animation: scorePop 0.3s ease; }
  @keyframes scorePop {
    0%   { transform: translateX(-50%) scale(1); }
    50%  { transform: translateX(-50%) scale(1.4); }
    100% { transform: translateX(-50%) scale(1); }
  }

  /* ========== WATERMARK ========== */
  #watermark {
    position: absolute;
    bottom: 12px;
    right: 14px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: rgba(255,255,255,0.35);
    text-shadow: 0 0 8px rgba(100,200,255,0.5);
    z-index: 20;
    pointer-events: none;
    animation: glow 3s ease-in-out infinite;
  }
  @keyframes glow {
    0%,100% { text-shadow: 0 0 6px rgba(100,200,255,0.4); color: rgba(255,255,255,0.32); }
    50%      { text-shadow: 0 0 14px rgba(100,200,255,0.75); color: rgba(255,255,255,0.55); }
  }

  /* ========== ARYAN POPUP ========== */
  #aryanPopup {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 30;
    pointer-events: all;
  }
  #aryanPopup.hidden {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }

  .popup-card {
    position: relative;
    width: 320px;
    padding: 32px 28px 26px;
    border-radius: 24px;
    text-align: center;

    /* Glassmorphism core */
    background: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.13) 0%,
      rgba(100, 180, 255, 0.09) 50%,
      rgba(255, 215, 60, 0.07) 100%
    );
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);

    /* Glowing animated border */
    border: 1.5px solid transparent;
    background-clip: padding-box;
    box-shadow:
      0 0 0 1.5px rgba(100,200,255,0.35),
      0 0 28px rgba(100,200,255,0.25),
      0 0 60px rgba(255,215,60,0.12),
      inset 0 1px 0 rgba(255,255,255,0.18),
      0 24px 48px rgba(0,0,0,0.45);

    /* Fade + slide-up entrance */
    animation: popupIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards,
               borderPulse 2.5s ease-in-out 0.55s infinite;
  }

  @keyframes popupIn {
    0%   { opacity: 0; transform: translateY(22px) scale(0.92); }
    100% { opacity: 1; transform: translateY(0)    scale(1); }
  }

  @keyframes borderPulse {
    0%,100% { box-shadow: 0 0 0 1.5px rgba(100,200,255,0.35), 0 0 28px rgba(100,200,255,0.25), 0 0 60px rgba(255,215,60,0.12), inset 0 1px 0 rgba(255,255,255,0.18), 0 24px 48px rgba(0,0,0,0.45); }
    50%     { box-shadow: 0 0 0 1.5px rgba(255,215,60,0.6),   0 0 40px rgba(255,215,60,0.35), 0 0 80px rgba(100,200,255,0.2), inset 0 1px 0 rgba(255,255,255,0.25), 0 24px 48px rgba(0,0,0,0.45); }
  }

  /* Trophy icon */
  .popup-trophy {
    font-size: 48px;
    display: block;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 14px rgba(255,215,60,0.8));
    animation: trophyBounce 1.8s ease-in-out 0.6s infinite;
  }
  @keyframes trophyBounce {
    0%,100% { transform: translateY(0) rotate(-4deg); }
    50%     { transform: translateY(-7px) rotate(4deg); }
  }

  /* Main challenge text */
  .popup-headline {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.45;
    letter-spacing: 0.3px;
    color: #ffffff;
    text-shadow: 0 0 18px rgba(100,200,255,0.5);
    margin-bottom: 6px;
  }
  .popup-headline .hs-num {
    font-size: 22px;
    font-weight: 900;
    color: #FFD93D;
    text-shadow: 0 0 16px rgba(255,217,61,0.65);
    letter-spacing: 1px;
  }
  .popup-headline .challenge {
    display: block;
    margin-top: 4px;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.5px;
  }

  /* Divider */
  .popup-divider {
    width: 60%;
    height: 1px;
    margin: 16px auto 14px;
    background: linear-gradient(90deg, transparent, rgba(100,200,255,0.5), transparent);
  }

  /* Made by line */
  .popup-madeby {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #6BCBFF, #FFD93D, #FF6B6B);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 8px rgba(107,203,255,0.4));
  }

  /* Auto-dismiss countdown ring */
  .popup-timer {
    margin-top: 18px;
    font-size: 10px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.3);
  }
  .popup-timer span {
    color: rgba(255,255,255,0.55);
    font-weight: 700;
  }

  /* ========== RESPONSIVE ========== */
  @media (max-height: 680px) {
    #gameWrapper { height: 95vh; width: calc(95vh * 0.656); }
  }
  @media (max-width: 440px) {
    #gameWrapper { width: 100vw; height: calc(100vw / 0.656); border-radius: 0; }
  }
</style>
</head>
<body>

<div id="gameWrapper">

  <!-- Main canvas -->
  <canvas id="gameCanvas" width="420" height="640"></canvas>

  <!-- Live score HUD -->
  <div id="hudScore">0</div>

  <!-- Start screen -->
  <div id="startScreen" class="screen">
    <div class="bird-icon">🐦</div>
    <h1>FLAPPY BIRD</h1>
    <p>TAP · CLICK · SPACE</p>
    <button class="btn" id="startBtn">PLAY NOW</button>
    <div class="hint">Dodge the pipes. Beat your best.</div>
  </div>

  <!-- Game Over screen -->
  <div id="gameoverScreen" class="screen hidden">
    <h2>GAME OVER</h2>
    <div class="score-card">
      <div class="label">Your Score</div>
      <div class="val" id="finalScore">0</div>
      <div class="best-row">Best: <span id="bestScore">0</span></div>
    </div>
    <button class="btn" id="restartBtn">PLAY AGAIN</button>
  </div>

  <!-- Aryan High Score Popup -->
  <div id="aryanPopup">
    <div class="popup-card">
      <span class="popup-trophy">🏆</span>
      <div class="popup-headline">
        Aryan's High Score: <span class="hs-num">100</span>
        <span class="challenge">Can You Beat That?</span>
      </div>
      <div class="popup-divider"></div>
      <div class="popup-madeby">Game Made by Aryan</div>
      <div class="popup-timer">Tap anywhere or wait <span id="popupCountdown">3</span>s</div>
    </div>
  </div>

  <!-- Watermark -->
  <div id="watermark">✦ Created by Legendary Aryan</div>

</div>

<script>
/* =====================================================
   FLAPPY BIRD — Complete Game Logic
   ===================================================== */

// ── Audio setup ──────────────────────────────────────
const audioCtx = (() => {
  try { return new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e) { return null; }
})();

function loadAudio(src) {
  return new Promise(resolve => {
    const audio = new Audio(src);
    audio.addEventListener('canplaythrough', () => resolve(audio), { once: true });
    audio.addEventListener('error', () => resolve(null), { once: true });
    audio.load();
  });
}

let sfxClick = null, sfxDie = null, bgMusic = null;
let audioReady = false;

async function initAudio() {
  if (audioReady) return;
  audioReady = true;
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  [sfxClick, sfxDie, bgMusic] = await Promise.all([
    loadAudio('click.mp3'),
    loadAudio('die.mp3'),
    loadAudio('background.mp3')
  ]);
  if (bgMusic) { bgMusic.loop = true; bgMusic.volume = 0.7; }
  if (sfxClick) sfxClick.volume = 0.7;
  if (sfxDie)   sfxDie.volume = 0.8;
}

function playSound(audio) {
  if (!audio) return;
  try { audio.currentTime = 0; audio.play().catch(()=>{}); }
  catch(e) {}
}

function startBgMusic() {
  if (bgMusic && bgMusic.paused) bgMusic.play().catch(()=>{});
}

function stopBgMusic() {
  if (bgMusic && !bgMusic.paused) { bgMusic.pause(); bgMusic.currentTime = 0; }
}

// ── Canvas & context ──────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// ── DOM references ────────────────────────────────────
const hudScore      = document.getElementById('hudScore');
const startScreen   = document.getElementById('startScreen');
const gameoverScreen= document.getElementById('gameoverScreen');
const finalScoreEl  = document.getElementById('finalScore');
const bestScoreEl   = document.getElementById('bestScore');

// ── Game state ────────────────────────────────────────
const STATES = { IDLE: 0, PLAYING: 1, DEAD: 2 };
let state = STATES.IDLE;
let score = 0;
let bestScore = parseInt(localStorage.getItem('flappyBest') || '0', 10);
let animId;

// ── Physics constants ─────────────────────────────────
const GRAVITY     = 0.45;
const JUMP_VEL    = -8.5;
const MAX_FALL    = 12;
const PIPE_SPEED  = 2.8;
const PIPE_GAP    = 155;
const PIPE_WIDTH  = 62;
const PIPE_INTERVAL = 1650; // ms between pipes
const GROUND_H    = 80;

// ── Bird ──────────────────────────────────────────────
const bird = {
  x: 100, y: H / 2 - 10,
  vy: 0,
  radius: 18,
  rotation: 0,
  wingAngle: 0, wingDir: 1,
  reset() {
    this.x = 100; this.y = H / 2 - 10;
    this.vy = 0; this.rotation = 0;
  }
};

// ── Pipes ─────────────────────────────────────────────
let pipes = [];
let lastPipeTime = 0;

function spawnPipe(timestamp) {
  const minTop = 80;
  const maxTop = H - GROUND_H - PIPE_GAP - 80;
  const topH   = minTop + Math.random() * (maxTop - minTop);
  pipes.push({ x: W + 10, topH, scored: false });
}

// ── Clouds ────────────────────────────────────────────
const clouds = Array.from({ length: 7 }, (_, i) => ({
  x: Math.random() * W,
  y: 40 + Math.random() * 180,
  scale: 0.5 + Math.random() * 0.8,
  speed: 0.2 + Math.random() * 0.35,
  opacity: 0.35 + Math.random() * 0.4
}));

// ── Stars (background) ────────────────────────────────
const stars = Array.from({ length: 55 }, () => ({
  x: Math.random() * W,
  y: Math.random() * (H * 0.55),
  r: 0.5 + Math.random() * 1.5,
  twinkle: Math.random() * Math.PI * 2
}));

// ── Score pop helper ──────────────────────────────────
function popScore() {
  hudScore.classList.remove('pop');
  void hudScore.offsetWidth; // reflow
  hudScore.classList.add('pop');
}

// ── DRAW helpers ─────────────────────────────────────

// Sky gradient + stars
function drawBackground() {
  // Deep sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
  grad.addColorStop(0,   '#0b1a3e');
  grad.addColorStop(0.35,'#0d2a5a');
  grad.addColorStop(0.7, '#1a5276');
  grad.addColorStop(1,   '#2980b9');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H - GROUND_H);

  // Stars
  stars.forEach(s => {
    s.twinkle += 0.02;
    const alpha = 0.4 + 0.5 * Math.sin(s.twinkle);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  });

  // Horizon glow
  const hGrad = ctx.createLinearGradient(0, H*0.45, 0, H - GROUND_H);
  hGrad.addColorStop(0, 'rgba(255,160,60,0)');
  hGrad.addColorStop(1, 'rgba(255,130,40,0.18)');
  ctx.fillStyle = hGrad;
  ctx.fillRect(0, H*0.45, W, H - GROUND_H - H*0.45);
}

// Animated clouds
function drawClouds() {
  clouds.forEach(c => {
    c.x -= c.speed * (state === STATES.PLAYING ? 1 : 0.3);
    if (c.x + 120 * c.scale < 0) {
      c.x = W + 20;
      c.y = 40 + Math.random() * 180;
      c.opacity = 0.35 + Math.random() * 0.4;
    }
    drawCloud(c.x, c.y, c.scale, c.opacity);
  });
}

function drawCloud(x, y, scale, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ffffff';
  const s = scale * 30;
  // Puffs
  [[0,0,s],[s*0.9,-s*0.4,s*0.85],[s*1.8,0,s*0.75],[s*2.6,0,s*0.65]].forEach(([dx,dy,r]) => {
    ctx.beginPath();
    ctx.arc(x + dx, y + dy, r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.restore();
}

// Ground
function drawGround() {
  // Dirt layer
  const dGrad = ctx.createLinearGradient(0, H - GROUND_H, 0, H);
  dGrad.addColorStop(0, '#5d4037');
  dGrad.addColorStop(1, '#3e2723');
  ctx.fillStyle = dGrad;
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);

  // Grass stripe
  const gGrad = ctx.createLinearGradient(0, H - GROUND_H, 0, H - GROUND_H + 22);
  gGrad.addColorStop(0, '#66bb6a');
  gGrad.addColorStop(1, '#388e3c');
  ctx.fillStyle = gGrad;
  ctx.fillRect(0, H - GROUND_H, W, 22);

  // Ground top line
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, H - GROUND_H); ctx.lineTo(W, H - GROUND_H);
  ctx.stroke();
}

// Pipes
function drawPipes() {
  pipes.forEach(p => {
    const botY = p.topH + PIPE_GAP;
    drawPipe(p.x, 0, PIPE_WIDTH, p.topH, true);
    drawPipe(p.x, botY, PIPE_WIDTH, H - GROUND_H - botY, false);
  });
}

function drawPipe(x, y, w, h, isTop) {
  if (h <= 0) return;
  const capH = 28, capExtra = 8;

  // Shadow
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#000';
  ctx.fillRect(x + 6, y + (isTop ? h - capH : 0), w, isTop ? capH : h);
  ctx.restore();

  // Body gradient
  const bGrad = ctx.createLinearGradient(x, 0, x + w, 0);
  bGrad.addColorStop(0,   '#2e7d32');
  bGrad.addColorStop(0.35,'#43a047');
  bGrad.addColorStop(0.65,'#388e3c');
  bGrad.addColorStop(1,   '#1b5e20');
  ctx.fillStyle = bGrad;
  ctx.fillRect(x, y, w, h);

  // Cap
  const cGrad = ctx.createLinearGradient(x - capExtra, 0, x + w + capExtra, 0);
  cGrad.addColorStop(0,   '#1b5e20');
  cGrad.addColorStop(0.3, '#4caf50');
  cGrad.addColorStop(0.7, '#388e3c');
  cGrad.addColorStop(1,   '#1b5e20');
  ctx.fillStyle = cGrad;
  const capY = isTop ? y + h - capH : y;
  ctx.fillRect(x - capExtra, capY, w + capExtra * 2, capH);

  // Highlight streak
  ctx.save();
  ctx.globalAlpha = 0.2;
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + 8, y, 7, h);
  ctx.restore();

  // Border
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x, y, w, h);
  ctx.strokeRect(x - capExtra, capY, w + capExtra*2, capH);
}

// Bird
function drawBird() {
  const { x, y, rotation, wingAngle } = bird;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);

  // Body shadow
  ctx.save();
  ctx.globalAlpha = 0.2;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(4, 4, 20, 16, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Wing
  ctx.save();
  ctx.rotate(wingAngle);
  const wGrad = ctx.createLinearGradient(-8, -8, 8, 8);
  wGrad.addColorStop(0, '#FFF176');
  wGrad.addColorStop(1, '#F9A825');
  ctx.fillStyle = wGrad;
  ctx.beginPath();
  ctx.ellipse(-6, 4, 12, 7, -0.4, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Body
  const bGrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, 20);
  bGrad.addColorStop(0, '#FFEE58');
  bGrad.addColorStop(0.6,'#FDD835');
  bGrad.addColorStop(1,  '#F57F17');
  ctx.fillStyle = bGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, 20, 16, 0, 0, Math.PI*2);
  ctx.fill();

  // Eye white
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(9, -5, 7, 0, Math.PI*2);
  ctx.fill();

  // Pupil
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.arc(11, -5, 3.5, 0, Math.PI*2);
  ctx.fill();

  // Eye shine
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(12.5, -6.5, 1.2, 0, Math.PI*2);
  ctx.fill();

  // Beak
  ctx.fillStyle = '#FF7043';
  ctx.beginPath();
  ctx.moveTo(14, -1); ctx.lineTo(26, 2); ctx.lineTo(14, 5);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#BF360C';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // Cheek blush
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#EF9A9A';
  ctx.beginPath();
  ctx.ellipse(7, 3, 5, 3, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  ctx.restore();
}

// ── GAME LOOP ─────────────────────────────────────────
let prevTimestamp = 0;

function gameLoop(timestamp) {
  const dt = Math.min(timestamp - prevTimestamp, 50); // cap at 50ms
  prevTimestamp = timestamp;

  ctx.clearRect(0, 0, W, H);

  drawBackground();
  drawClouds();
  drawPipes();
  drawGround();
  drawBird();

  if (state === STATES.PLAYING) {
    updatePhysics(dt, timestamp);
    updatePipes(timestamp);
    checkCollision();
  } else if (state === STATES.IDLE) {
    // Gentle float in idle
    bird.y = H/2 - 10 + Math.sin(timestamp * 0.002) * 14;
    bird.rotation = Math.sin(timestamp * 0.002) * 0.18;
  }

  // Wing flap
  bird.wingAngle += 0.12 * bird.wingDir;
  if (bird.wingAngle > 0.5 || bird.wingAngle < -0.5) bird.wingDir *= -1;

  animId = requestAnimationFrame(gameLoop);
}

function updatePhysics(dt, timestamp) {
  bird.vy += GRAVITY;
  if (bird.vy > MAX_FALL) bird.vy = MAX_FALL;
  bird.y += bird.vy;

  // Rotation: tilt up on rise, tilt down on fall
  const targetRot = Math.max(-0.45, Math.min(1.3, bird.vy * 0.065));
  bird.rotation += (targetRot - bird.rotation) * 0.18;
}

function updatePipes(timestamp) {
  // Spawn
  if (timestamp - lastPipeTime > PIPE_INTERVAL) {
    spawnPipe(timestamp);
    lastPipeTime = timestamp;
  }
  // Move & score
  pipes.forEach(p => {
    p.x -= PIPE_SPEED;
    if (!p.scored && p.x + PIPE_WIDTH < bird.x - bird.radius) {
      p.scored = true;
      score++;
      hudScore.textContent = score;
      popScore();
    }
  });
  // Remove off-screen
  pipes = pipes.filter(p => p.x + PIPE_WIDTH + 20 > 0);
}

function checkCollision() {
  // Ground / ceiling
  if (bird.y + bird.radius >= H - GROUND_H || bird.y - bird.radius <= 0) {
    triggerDeath();
    return;
  }
  // Pipes
  for (const p of pipes) {
    const birdLeft  = bird.x - bird.radius + 4;
    const birdRight = bird.x + bird.radius - 4;
    const birdTop   = bird.y - bird.radius + 4;
    const birdBot   = bird.y + bird.radius - 4;
    const pRight = p.x + PIPE_WIDTH;
    const botY   = p.topH + PIPE_GAP;

    if (birdRight > p.x && birdLeft < pRight) {
      if (birdTop < p.topH || birdBot > botY) {
        triggerDeath();
        return;
      }
    }
  }
}

function triggerDeath() {
  state = STATES.DEAD;
  stopBgMusic();
  playSound(sfxDie);

  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('flappyBest', bestScore);
  }

  finalScoreEl.textContent = score;
  bestScoreEl.textContent  = bestScore;

  setTimeout(() => {
    gameoverScreen.classList.remove('hidden');
  }, 600);
}

// ── JUMP ──────────────────────────────────────────────
function jump() {
  if (state === STATES.DEAD) return;
  initAudio();
  if (state === STATES.IDLE) {
    startGame();
    return;
  }
  bird.vy = JUMP_VEL;
  playSound(sfxClick);
}

// ── START / RESTART ───────────────────────────────────
function startGame() {
  score = 0;
  hudScore.textContent = '0';
  pipes = [];
  lastPipeTime = -PIPE_INTERVAL; // spawn first pipe quickly
  bird.reset();
  state = STATES.PLAYING;
  startScreen.classList.add('hidden');
  gameoverScreen.classList.add('hidden');
  startBgMusic();
  bird.vy = JUMP_VEL; // initial jump
  playSound(sfxClick);
}

function restartGame() {
  gameoverScreen.classList.add('hidden');
  startGame();
}

// ── INPUT EVENTS ──────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    jump();
  }
});

canvas.addEventListener('click', e => { e.preventDefault(); jump(); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); }, { passive: false });

document.getElementById('startBtn').addEventListener('click', e => {
  e.stopPropagation();
  initAudio().then(startGame);
});

document.getElementById('restartBtn').addEventListener('click', e => {
  e.stopPropagation();
  initAudio().then(restartGame);
});

// ── ARYAN POPUP ───────────────────────────────────────
const aryanPopup      = document.getElementById('aryanPopup');
const popupCountdown  = document.getElementById('popupCountdown');
let popupDismissed    = false;
let popupCountdownVal = 8;

function dismissPopup() {
  if (popupDismissed) return;
  popupDismissed = true;
  aryanPopup.classList.add('hidden');
}

// Countdown ticker — updates every second
const popupTicker = setInterval(() => {
  popupCountdownVal--;
  if (popupCountdown) popupCountdown.textContent = popupCountdownVal;
  if (popupCountdownVal <= 0) {
    clearInterval(popupTicker);
    dismissPopup();
  }
}, 1000);

// Dismiss on any tap/click/key while popup is visible
aryanPopup.addEventListener('click',     () => { clearInterval(popupTicker); dismissPopup(); });
aryanPopup.addEventListener('touchstart',() => { clearInterval(popupTicker); dismissPopup(); }, { passive: true });
document.addEventListener('keydown', e => {
  if (!popupDismissed && (e.code === 'Space' || e.code === 'ArrowUp')) {
    clearInterval(popupTicker);
    dismissPopup();
  }
});

// ── KICK OFF ──────────────────────────────────────────
bestScoreEl.textContent = bestScore;
animId = requestAnimationFrame(gameLoop);
</script>

</body>
</html>
